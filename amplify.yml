version: 1
frontend:
  phases:
    preBuild:
      commands:
        - echo "No npm build needed for static frontend"
    build:
      commands:
        - echo "window.__SEISMO_API_BASE__='${API_BASE_URL}';" > frontend/config.js
  artifacts:
    baseDirectory: frontend
    files:
      - "**/*"
  cache:
    paths: []
