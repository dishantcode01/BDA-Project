version: 1
frontend:
  phases:
    preBuild:
      commands:
        - echo "No npm build needed for static frontend"
    build:
      commands:
        - echo "window.__SEISMO_API_BASE__='${API_BASE_URL:-}';" > frontend/config.js
        - echo "window.__SEISMO_STATIC_MODE__=${STATIC_MODE:-false};" >> frontend/config.js
        - echo "window.__SEISMO_CHARTS_BASE__='${CHARTS_BASE_URL:-https://raw.githubusercontent.com/dishantcode01/BDA-Project/main/report/charts}';" >> frontend/config.js
  artifacts:
    baseDirectory: frontend
    files:
      - "**/*"
  cache:
    paths: []
